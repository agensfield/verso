name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test -race ./...
        env:
          GOPROXY: off
      - run: go vet ./...
        env:
          GOPROXY: off
      - name: CLI smoke
        run: |
          go build -o "$RUNNER_TEMP/verso" ./cmd/verso
          "$RUNNER_TEMP/verso" --help
          "$RUNNER_TEMP/verso" version
          "$RUNNER_TEMP/verso" licenses > "$RUNNER_TEMP/verso-licenses"
